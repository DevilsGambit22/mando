<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>The Mandalorians Club | New Members</title>

<style>

/* =========================================================
   RESET
   ========================================================= */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:transparent;
}

body{
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Helvetica,
    Arial,
    sans-serif;

  overflow-x:hidden;
}


/* =========================================================
   BOARD
   ========================================================= */

.member-board{
  position:relative;

  width:100%;
  max-width:768px;

  /*
    The artwork is 768 x 1536.
    This keeps the exact proportions on desktop and mobile.
  */
  aspect-ratio:768 / 1536;

  margin:0 auto;

  overflow:hidden;
}


/* =========================================================
   BOARD ARTWORK
   ========================================================= */

.board-art{
  position:absolute;

  top:0;
  left:0;

  width:100%;
  height:100%;

  object-fit:fill;

  display:block;

  z-index:1;

  pointer-events:none;
  user-select:none;
}


/* =========================================================
   MEMBER LIST POSITION
   ========================================================= */

/*
  This overlay is positioned over the 10 empty rows
  in new-members-board.png.
*/

.member-list{
  position:absolute;

  left:6%;
  right:6%;

  top:20.3%;
  height:60.2%;

  display:grid;
  grid-template-rows:repeat(10,1fr);

  z-index:5;
}


/* =========================================================
   INDIVIDUAL MEMBER
   ========================================================= */

.member{
  position:relative;

  display:grid;

  grid-template-columns:
    clamp(38px,7.5vw,58px)
    minmax(0,1fr)
    auto;

  align-items:center;

  gap:clamp(7px,1.5vw,13px);

  padding-left:clamp(14px,3vw,25px);
  padding-right:clamp(15px,3.3vw,28px);

  min-width:0;

  color:#ffffff;

  transition:
    transform .22s ease,
    filter .22s ease;
}


/* =========================================================
   MEMBER HOVER
   ========================================================= */

.member:hover{
  transform:scale(1.025);

  filter:
    brightness(1.15)
    drop-shadow(
      0 0 7px
      rgba(63,220,255,.75)
    );
}


/* =========================================================
   AVATAR
   ========================================================= */

.avatar-wrap{
  position:relative;

  display:flex;
  align-items:center;
  justify-content:center;

  width:clamp(34px,7vw,54px);
  height:clamp(34px,7vw,54px);

  border-radius:50%;

  border:
    clamp(1px,.25vw,2px)
    solid
    #67e6ff;

  background:#06111d;

  overflow:hidden;

  box-shadow:
    0 0 5px rgba(89,226,255,.95),
    0 0 12px rgba(0,188,255,.75),
    0 0 22px rgba(0,144,255,.35);
}

.avatar{
  display:block;

  width:100%;
  height:100%;

  object-fit:cover;

  border-radius:50%;
}


/* =========================================================
   USER INFORMATION
   ========================================================= */

.member-info{
  min-width:0;
  overflow:hidden;
}

.username-line{
  display:flex;

  align-items:center;

  gap:5px;

  min-width:0;
}


/* =========================================================
   CHESS TITLE
   ========================================================= */

.title{
  flex:none;

  padding:1px 4px;

  border-radius:3px;

  background:#c83c3c;

  color:#ffffff;

  font-size:clamp(6px,1.25vw,9px);

  line-height:1.3;

  font-weight:900;
}


/* =========================================================
   USERNAME
   ========================================================= */

.username{
  display:block;

  min-width:0;

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;

  color:#ffffff;

  font-size:clamp(10px,2vw,16px);

  font-weight:800;

  text-decoration:none;

  text-shadow:
    0 0 4px rgba(255,255,255,.45),
    0 0 8px rgba(55,213,255,.8);
}

.username:hover{
  color:#c6f8ff;
}


/* =========================================================
   NEW MEMBER LABEL
   ========================================================= */

.meta{
  margin-top:2px;

  color:#a6c4d4;

  font-size:clamp(6px,1.3vw,10px);

  font-weight:600;

  letter-spacing:.3px;

  white-space:nowrap;
}


/* =========================================================
   RATING
   ========================================================= */

.rating{
  min-width:clamp(38px,8vw,64px);

  text-align:right;

  color:#9ef1ff;

  font-size:clamp(10px,2.2vw,17px);

  font-weight:900;

  letter-spacing:.4px;

  text-shadow:
    0 0 4px #4edfff,
    0 0 10px rgba(0,196,255,.9),
    0 0 18px rgba(0,135,255,.5);
}


/* =========================================================
   RATING TYPE
   ========================================================= */

.rating-label{
  display:block;

  margin-top:2px;

  color:#92b9cb;

  font-size:clamp(5px,1.05vw,8px);

  font-weight:800;

  letter-spacing:1.5px;

  text-transform:uppercase;
}


/* =========================================================
   LOADING MESSAGE
   ========================================================= */

.status{
  position:absolute;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  z-index:20;

  padding:9px 15px;

  background:
    rgba(1,9,20,.94);

  border:
    1px solid
    rgba(83,223,255,.65);

  border-radius:8px;

  color:#baf5ff;

  font-size:11px;

  font-weight:800;

  letter-spacing:1px;

  white-space:nowrap;

  box-shadow:
    0 0 8px rgba(0,190,255,.5),
    0 0 20px rgba(0,150,255,.3);
}

.status.error{
  color:#ffd0d0;

  border-color:
    rgba(255,90,90,.6);
}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:480px){

  .member-list{
    left:6%;
    right:6%;

    top:20.3%;
    height:60.2%;
  }

  .member{
    grid-template-columns:
      36px
      minmax(0,1fr)
      43px;

    gap:7px;

    padding-left:13px;
    padding-right:15px;
  }

  .avatar-wrap{
    width:34px;
    height:34px;
  }

  .username{
    font-size:10px;
  }

  .meta{
    font-size:6px;
  }

  .rating{
    min-width:42px;

    font-size:11px;
  }

  .rating-label{
    font-size:5px;
    letter-spacing:1px;
  }

}


/* =========================================================
   VERY SMALL SCREENS
   ========================================================= */

@media(max-width:330px){

  .member{
    grid-template-columns:
      31px
      minmax(0,1fr)
      38px;

    gap:5px;

    padding-left:11px;
    padding-right:12px;
  }

  .avatar-wrap{
    width:30px;
    height:30px;
  }

  .username{
    font-size:9px;
  }

  .rating{
    font-size:10px;
  }

}

</style>
</head>


<body>


<!-- =======================================================
     NEW MEMBER BOARD
     ======================================================= -->

<div class="member-board">


  <!--
    IMPORTANT:

    Keep this image in the SAME GitHub repository
    as index.html.

    Filename:

    new-members-board.png
  -->

  <img
    class="board-art"
    src="./new-members-board.png"
    alt=""
  >


  <!-- Loading message -->

  <div
    id="status"
    class="status"
  >
    SCANNING CLUB ROSTER...
  </div>


  <!-- API members appear here -->

  <div
    id="memberList"
    class="member-list"
  ></div>


</div>


<script>

/* =========================================================
   CONFIGURATION
   ========================================================= */

const CLUB_SLUG =
  "the-mandalorians-club-1";

const MEMBER_LIMIT =
  10;


/* =========================================================
   FETCH JSON
   ========================================================= */

async function fetchJSON(url){

  const response =
    await fetch(
      url,
      {
        headers:{
          "Accept":"application/json"
        }
      }
    );

  if(!response.ok){

    throw new Error(
      "Chess.com API returned " +
      response.status
    );

  }

  return response.json();

}


/* =========================================================
   FIND HIGHEST CURRENT RATING
   ========================================================= */

function getHighestRating(stats){

  const ratings = [];


  const categories = [

    [
      "Rapid",
      stats?.chess_rapid?.last?.rating
    ],

    [
      "Blitz",
      stats?.chess_blitz?.last?.rating
    ],

    [
      "Bullet",
      stats?.chess_bullet?.last?.rating
    ],

    [
      "Daily",
      stats?.chess_daily?.last?.rating
    ],

    [
      "960",
      stats?.chess960_daily?.last?.rating
    ]

  ];


  for(
    const [category,rating]
    of categories
  ){

    if(
      typeof rating === "number" &&
      Number.isFinite(rating)
    ){

      ratings.push({
        category,
        rating
      });

    }

  }


  if(!ratings.length){

    return {
      value:"—",
      category:"UNRATED"
    };

  }


  ratings.sort(
    (a,b) =>
      b.rating - a.rating
  );


  return {

    value:
      ratings[0].rating,

    category:
      ratings[0].category

  };

}


/* =========================================================
   GET NEWEST CLUB MEMBERS
   ========================================================= */

async function getNewestMembers(){

  const url =
    "https://api.chess.com/pub/club/" +
    CLUB_SLUG +
    "/members";


  const data =
    await fetchJSON(url);


  /*
    Chess.com divides the member list into:

    weekly
    monthly
    all_time

    Combine all three.
  */

  const combined = [

    ...(data.weekly || []),

    ...(data.monthly || []),

    ...(data.all_time || [])

  ];


  /*
    Remove duplicate usernames.
  */

  const unique =
    new Map();


  for(const member of combined){

    if(!member?.username){
      continue;
    }


    const key =
      member.username
        .toLowerCase();


    if(!unique.has(key)){

      unique.set(
        key,
        member
      );

    }

  }


  /*
    Newest join date first.
  */

  const members =
    [...unique.values()];


  members.sort(

    (a,b) =>

      (b.joined || 0) -
      (a.joined || 0)

  );


  return members.slice(
    0,
    MEMBER_LIMIT
  );

}


/* =========================================================
   LOAD PROFILE + STATS
   ========================================================= */

async function enrichMember(member){

  const username =
    member.username;


  const encodedUsername =
    encodeURIComponent(
      username
    );


  const profileURL =
    "https://api.chess.com/pub/player/" +
    encodedUsername;


  const statsURL =
    "https://api.chess.com/pub/player/" +
    encodedUsername +
    "/stats";


  /*
    Load profile and stats simultaneously.
  */

  const results =
    await Promise.allSettled([

      fetchJSON(profileURL),

      fetchJSON(statsURL)

    ]);


  const profile =

    results[0].status === "fulfilled"

      ? results[0].value

      : {};


  const stats =

    results[1].status === "fulfilled"

      ? results[1].value

      : {};


  const highest =
    getHighestRating(stats);


  return {

    username:
      username,

    avatar:
      profile.avatar || "",

    title:
      profile.title || "",

    rating:
      highest.value,

    category:
      highest.category

  };

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(value){

  return String(
    value ?? ""
  )

  .replaceAll(
    "&",
    "&amp;"
  )

  .replaceAll(
    "<",
    "&lt;"
  )

  .replaceAll(
    ">",
    "&gt;"
  )

  .replaceAll(
    '"',
    "&quot;"
  )

  .replaceAll(
    "'",
    "&#039;"
  );

}


/* =========================================================
   DEFAULT AVATAR
   ========================================================= */

function getFallbackAvatar(){

  const svg = `

  <svg
    xmlns="http://www.w3.org/2000/svg"
    width="100"
    height="100"
    viewBox="0 0 100 100"
  >

    <rect
      width="100"
      height="100"
      fill="#07121f"
    />

    <circle
      cx="50"
      cy="28"
      r="13"
      fill="#65e5ff"
    />

    <path
      d="
        M39 42
        H61
        C61 54 66 62 72 69
        H28
        C34 62 39 54 39 42
        Z
      "
      fill="#65e5ff"
    />

    <rect
      x="24"
      y="69"
      width="52"
      height="10"
      rx="4"
      fill="#65e5ff"
    />

    <rect
      x="18"
      y="79"
      width="64"
      height="9"
      rx="4"
      fill="#65e5ff"
    />

  </svg>

  `;


  return (

    "data:image/svg+xml;charset=UTF-8," +

    encodeURIComponent(svg)

  );

}


/* =========================================================
   BUILD MEMBER ROW
   ========================================================= */

function createMemberHTML(member){

  const username =
    escapeHTML(
      member.username
    );


  const title =
    escapeHTML(
      member.title
    );


  const rating =
    escapeHTML(
      member.rating
    );


  const category =
    escapeHTML(
      member.category
    );


  const profileURL =

    "https://www.chess.com/member/" +

    encodeURIComponent(
      member.username
    );


  const fallback =
    getFallbackAvatar();


  const avatar =

    member.avatar

      ? escapeHTML(
          member.avatar
        )

      : fallback;


  return `

    <div class="member">


      <!-- AVATAR -->

      <div class="avatar-wrap">

        <img
          class="avatar"

          src="${avatar}"

          alt="${username}"

          loading="lazy"

          onerror="
            this.onerror=null;
            this.src='${fallback}';
          "
        >

      </div>


      <!-- USER INFORMATION -->

      <div class="member-info">


        <div class="username-line">


          ${
            title

            ?

            `
            <span class="title">
              ${title}
            </span>
            `

            :

            ""
          }


          <a
            class="username"

            href="${profileURL}"

            target="_blank"

            rel="noopener noreferrer"
          >
            ${username}
          </a>


        </div>


        <div class="meta">

          NEW MEMBER

        </div>


      </div>


      <!-- RATING -->

      <div class="rating">

        ${rating}


        <span class="rating-label">

          ${category}

        </span>

      </div>


    </div>

  `;

}


/* =========================================================
   LOAD BOARD
   ========================================================= */

async function loadBoard(){

  const status =
    document.getElementById(
      "status"
    );


  const memberList =
    document.getElementById(
      "memberList"
    );


  try{


    status.style.display =
      "block";


    status.textContent =
      "SCANNING CLUB ROSTER...";


    status.classList.remove(
      "error"
    );


    /*
      Get newest members.
    */

    const newest =
      await getNewestMembers();


    if(!newest.length){

      throw new Error(
        "No members returned."
      );

    }


    /*
      Get each member's profile
      and rating information.
    */

    const members =
      await Promise.all(

        newest.map(
          enrichMember
        )

      );


    /*
      Build all 10 rows.
    */

    memberList.innerHTML =

      members

        .map(
          createMemberHTML
        )

        .join("");


    /*
      Hide loading message.
    */

    status.style.display =
      "none";


  }

  catch(error){


    console.error(
      "Member board error:",
      error
    );


    status.textContent =
      "ROSTER UNAVAILABLE";


    status.classList.add(
      "error"
    );


  }

}


/* =========================================================
   START
   ========================================================= */

loadBoard();


/* =========================================================
   AUTO REFRESH
   ========================================================= */

/*
  Refresh every 5 minutes.

  This allows new club members and rating
  information to update automatically.
*/

setInterval(

  loadBoard,

  5 * 60 * 1000

);

</script>


</body>
</html>
