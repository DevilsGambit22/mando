<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>New Members</title>

<style>

/* =========================================================
   GLOBAL
   ========================================================= */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#000000;
  overflow:hidden;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}


/* =========================================================
   BOARD
   ========================================================= */

#board{
  position:relative;

  width:100%;
  max-width:768px;

  aspect-ratio:768 / 1536;

  margin:0 auto;

  overflow:hidden;

  background:#000000;
}


/* =========================================================
   BOARD ART
   ========================================================= */

#boardArt{
  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  object-fit:fill;

  display:block;

  z-index:1;

  pointer-events:none;
  user-select:none;
}


/* =========================================================
   LIVE MEMBER AREA
   EXACTLY THREE MEMBERS
   ========================================================= */

#members{
  position:absolute;

  left:6%;
  right:6%;

  /*
    These values position the live member data
    over the three slots on the new board.
  */

  top:34.2%;
  height:40.5%;

  display:grid;

  grid-template-rows:repeat(3,1fr);

  z-index:5;
}


/* =========================================================
   MEMBER ROW
   ========================================================= */

.member{
  display:grid;

  grid-template-columns:
    clamp(48px,10vw,76px)
    minmax(0,1fr)
    auto;

  align-items:center;

  gap:clamp(10px,2vw,18px);

  padding-left:clamp(18px,4vw,32px);
  padding-right:clamp(18px,4vw,32px);

  min-width:0;

  transition:
    transform .2s ease,
    filter .2s ease;
}


/* =========================================================
   MEMBER HOVER
   ========================================================= */

.member:hover{
  transform:scale(1.025);

  filter:
    brightness(1.15)
    drop-shadow(
      0 0 8px
      rgba(75,220,255,.85)
    );
}


/* =========================================================
   AVATAR
   ========================================================= */

.avatar-shell{
  display:flex;

  align-items:center;
  justify-content:center;

  width:clamp(48px,10vw,76px);
  height:clamp(48px,10vw,76px);

  border-radius:50%;

  overflow:hidden;

  border:2px solid #65e5ff;

  background:#07121f;

  box-shadow:
    0 0 5px rgba(89,226,255,.95),
    0 0 12px rgba(0,188,255,.7),
    0 0 22px rgba(0,144,255,.4);
}

.avatar{
  display:block;

  width:100%;
  height:100%;

  object-fit:cover;

  border-radius:50%;
}


/* =========================================================
   MEMBER INFORMATION
   ========================================================= */

.member-data{
  min-width:0;

  overflow:hidden;
}

.name-row{
  display:flex;

  align-items:center;

  gap:6px;

  min-width:0;
}


/* =========================================================
   USERNAME
   ========================================================= */

.username{
  display:block;

  min-width:0;

  overflow:hidden;

  text-overflow:ellipsis;

  white-space:nowrap;

  color:#ffffff;

  font-size:clamp(
    13px,
    2.8vw,
    21px
  );

  font-weight:800;

  text-decoration:none;

  text-shadow:
    0 0 5px rgba(255,255,255,.4),
    0 0 10px rgba(54,216,255,.9);
}

.username:hover{
  color:#baf5ff;
}


/* =========================================================
   CHESS TITLE
   ========================================================= */

.title{
  flex:none;

  padding:2px 5px;

  border-radius:3px;

  background:#c63d3d;

  color:#ffffff;

  font-size:clamp(
    7px,
    1.5vw,
    11px
  );

  font-weight:900;
}


/* =========================================================
   NEW MEMBER LABEL
   ========================================================= */

.member-label{
  margin-top:4px;

  color:#9dbdcc;

  font-size:clamp(
    7px,
    1.5vw,
    11px
  );

  font-weight:700;

  letter-spacing:.7px;

  text-transform:uppercase;
}


/* =========================================================
   RATING
   ========================================================= */

.rating{
  min-width:clamp(
    48px,
    10vw,
    78px
  );

  text-align:right;

  color:#a7f3ff;

  font-size:clamp(
    13px,
    2.8vw,
    21px
  );

  font-weight:900;

  text-shadow:
    0 0 5px #4edfff,
    0 0 11px rgba(0,196,255,.8);
}

.rating-type{
  display:block;

  margin-top:3px;

  color:#8eb6c8;

  font-size:clamp(
    6px,
    1.25vw,
    9px
  );

  font-weight:800;

  letter-spacing:1.2px;

  text-transform:uppercase;
}


/* =========================================================
   LOADING STATUS
   ========================================================= */

#status{
  position:absolute;

  left:50%;
  top:55%;

  transform:
    translate(-50%,-50%);

  z-index:20;

  padding:8px 12px;

  border:
    1px solid
    rgba(75,220,255,.6);

  border-radius:7px;

  background:
    rgba(0,0,0,.95);

  color:#a7f3ff;

  font-size:10px;

  font-weight:800;

  letter-spacing:1px;

  white-space:nowrap;

  box-shadow:
    0 0 15px
    rgba(0,190,255,.35);
}


/* =========================================================
   MOBILE SIDEBAR
   ========================================================= */

@media(max-width:480px){

  .member{

    grid-template-columns:
      45px
      minmax(0,1fr)
      48px;

    gap:8px;

    padding-left:14px;
    padding-right:16px;
  }

  .avatar-shell{
    width:45px;
    height:45px;
  }

  .username{
    font-size:12px;
  }

  .title{
    font-size:7px;

    padding:1px 4px;
  }

  .member-label{
    font-size:7px;

    margin-top:2px;
  }

  .rating{
    font-size:12px;
  }

  .rating-type{
    font-size:6px;
  }

}

</style>
</head>


<body>


<div id="board">


  <!-- =====================================================
       NEW MEMBERS BOARD IMAGE

       Keep this filename if the new three-slot image
       replaced the previous image in GitHub.
       ===================================================== -->

  <img
    id="boardArt"
    src="./new-members-board.png.PNG"
    alt="New Members Board"
  >


  <!-- =====================================================
       API STATUS
       ===================================================== -->

  <div id="status">
    LOADING MEMBERS...
  </div>


  <!-- =====================================================
       THREE MEMBERS ARE INSERTED HERE
       ===================================================== -->

  <div id="members"></div>


</div>


<script>


/* =========================================================
   CONFIGURATION
   ========================================================= */

const CLUB =
  "the-mandalorians-club-1";


/*
  The board now displays ONLY
  the three newest club members.
*/

const LIMIT = 3;


/* =========================================================
   CHESS.COM API
   ========================================================= */

async function getJSON(url){

  const response =
    await fetch(url);

  if(!response.ok){

    throw new Error(
      `Chess.com API returned ${response.status}`
    );

  }

  return response.json();

}


/* =========================================================
   GET NEWEST CLUB MEMBERS
   ========================================================= */

async function getNewestMembers(){

  const data =
    await getJSON(
      `https://api.chess.com/pub/club/${CLUB}/members`
    );


  /*
    Chess.com divides club members into:

    weekly
    monthly
    all_time

    We combine all three.
  */

  const combined = [

    ...(data.weekly || []),

    ...(data.monthly || []),

    ...(data.all_time || [])

  ];


  /*
    The same member may appear in
    multiple categories.

    Remove duplicate usernames.
  */

  const unique =
    new Map();


  for(
    const member
    of combined
  ){

    if(
      !member?.username
    ){

      continue;

    }


    const key =
      member
        .username
        .toLowerCase();


    if(
      !unique.has(key)
    ){

      unique.set(
        key,
        member
      );

    }

  }


  /*
    Sort using the Chess.com
    joined timestamp.

    Newest timestamp first.
  */

  return [

    ...unique.values()

  ]

  .sort(

    (a,b) =>

      (b.joined || 0)
      -
      (a.joined || 0)

  )

  /*
    ONLY KEEP THREE
  */

  .slice(
    0,
    LIMIT
  );

}


/* =========================================================
   FIND HIGHEST CURRENT RATING
   ========================================================= */

function highestRating(stats){

  const ratings = [


    {
      type:"Rapid",

      value:
        stats
          ?.chess_rapid
          ?.last
          ?.rating
    },


    {
      type:"Blitz",

      value:
        stats
          ?.chess_blitz
          ?.last
          ?.rating
    },


    {
      type:"Bullet",

      value:
        stats
          ?.chess_bullet
          ?.last
          ?.rating
    },


    {
      type:"Daily",

      value:
        stats
          ?.chess_daily
          ?.last
          ?.rating
    },


    {
      type:"960",

      value:
        stats
          ?.chess960_daily
          ?.last
          ?.rating
    }


  ];


  const valid =
    ratings.filter(

      item =>
        Number.isFinite(
          item.value
        )

    );


  if(
    !valid.length
  ){

    return {

      type:"Unrated",

      value:"—"

    };

  }


  valid.sort(

    (a,b) =>
      b.value - a.value

  );


  return valid[0];

}


/* =========================================================
   LOAD INDIVIDUAL MEMBER
   ========================================================= */

async function loadMember(member){


  const encoded =
    encodeURIComponent(
      member.username
    );


  /*
    Load profile and statistics
    simultaneously.
  */

  const results =
    await Promise.allSettled([


      getJSON(

        `https://api.chess.com/pub/player/${encoded}`

      ),


      getJSON(

        `https://api.chess.com/pub/player/${encoded}/stats`

      )


    ]);


  const profile =

    results[0].status
      ===
      "fulfilled"

      ?

      results[0].value

      :

      {};


  const stats =

    results[1].status
      ===
      "fulfilled"

      ?

      results[1].value

      :

      {};


  const best =
    highestRating(stats);


  return {


    username:
      member.username,


    avatar:
      profile.avatar || "",


    title:
      profile.title || "",


    rating:
      best.value,


    ratingType:
      best.type


  };

}


/* =========================================================
   FALLBACK AVATAR
   ========================================================= */

function fallbackAvatar(){


  const svg = `

  <svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 100 100">

    <rect
      width="100"
      height="100"
      fill="#07121f"
    />

    <circle
      cx="50"
      cy="28"
      r="13"
      fill="#65e5ff"
    />

    <path
      d="M39 42H61C61 54 66 62 72 69H28C34 62 39 54 39 42Z"
      fill="#65e5ff"
    />

    <rect
      x="24"
      y="69"
      width="52"
      height="10"
      rx="4"
      fill="#65e5ff"
    />

    <rect
      x="18"
      y="79"
      width="64"
      height="9"
      rx="4"
      fill="#65e5ff"
    />

  </svg>

  `;


  return (

    "data:image/svg+xml;charset=UTF-8,"

    +

    encodeURIComponent(svg)

  );

}


/* =========================================================
   SAFE HTML
   ========================================================= */

function safe(value){

  return String(
    value ?? ""
  )

  .replaceAll(
    "&",
    "&amp;"
  )

  .replaceAll(
    "<",
    "&lt;"
  )

  .replaceAll(
    ">",
    "&gt;"
  )

  .replaceAll(
    '"',
    "&quot;"
  )

  .replaceAll(
    "'",
    "&#039;"
  );

}


/* =========================================================
   CREATE MEMBER ROW
   ========================================================= */

function memberHTML(member){


  const username =
    safe(
      member.username
    );


  const title =
    safe(
      member.title
    );


  const rating =
    safe(
      member.rating
    );


  const ratingType =
    safe(
      member.ratingType
    );


  const profileURL =

    `https://www.chess.com/member/${
      encodeURIComponent(
        member.username
      )
    }`;


  const avatar =

    member.avatar

    ||

    fallbackAvatar();


  return `


    <div class="member">


      <div class="avatar-shell">


        <img
          class="avatar"
          src="${safe(avatar)}"
          alt="${username}"
          loading="lazy"
        >


      </div>


      <div class="member-data">


        <div class="name-row">


          ${
            title

            ?

            `<span class="title">${title}</span>`

            :

            ""
          }


          <a
            class="username"
            href="${profileURL}"
            target="_blank"
            rel="noopener noreferrer"
          >

            ${username}

          </a>


        </div>


        <div class="member-label">

          NEW MEMBER

        </div>


      </div>


      <div class="rating">


        ${rating}


        <span class="rating-type">

          ${ratingType}

        </span>


      </div>


    </div>


  `;

}


/* =========================================================
   RENDER BOARD
   ========================================================= */

async function renderMembers(){


  const status =
    document.getElementById(
      "status"
    );


  const container =
    document.getElementById(
      "members"
    );


  try{


    status.style.display =
      "block";


    status.textContent =
      "LOADING MEMBERS...";


    /*
      Find the three newest
      club members.
    */

    const newest =
      await getNewestMembers();


    if(
      !newest.length
    ){

      throw new Error(
        "No club members returned."
      );

    }


    /*
      Fetch profile information
      for all three simultaneously.
    */

    const members =
      await Promise.all(

        newest.map(
          loadMember
        )

      );


    /*
      Insert the three members
      into the three board slots.
    */

    container.innerHTML =

      members

        .map(
          memberHTML
        )

        .join("");


    status.style.display =
      "none";


  }


  catch(error){


    console.error(
      "Member board:",
      error
    );


    status.textContent =
      "MEMBERS UNAVAILABLE";


  }

}


/* =========================================================
   INITIAL LOAD
   ========================================================= */

renderMembers();


/* =========================================================
   AUTOMATIC REFRESH

   Recheck Chess.com every five minutes.
   ========================================================= */

setInterval(

  renderMembers,

  5 * 60 * 1000

);


</script>


</body>
</html>
