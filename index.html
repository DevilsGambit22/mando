<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>The Mandalorians Club | New Members</title>

<style>
:root{
  --cyan:#53dfff;
  --cyan-bright:#baf5ff;
  --text:#f4fbff;
  --muted:#9bb8c9;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:transparent;
  overflow-x:hidden;
}

body{
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
}

/* =========================================================
   BOARD
   ========================================================= */

.member-board{
  position:relative;
  width:100%;
  max-width:768px;
  aspect-ratio:768 / 1536;
  margin:0 auto;

  background-image:url("new-members-board.png");
  background-repeat:no-repeat;
  background-position:center top;
  background-size:100% 100%;

  overflow:hidden;
}

/*
  The artwork's member area begins around 20.4% from the top
  and ends around 80.5%.

  These values let the API content sit directly over the
  ten empty panels.
*/

.member-list{
  position:absolute;

  left:6.1%;
  right:6.1%;

  top:20.55%;
  height:59.7%;

  display:grid;
  grid-template-rows:repeat(10,1fr);

  z-index:5;
}

/* =========================================================
   MEMBER ROW
   ========================================================= */

.member{
  position:relative;

  display:grid;
  grid-template-columns:
    clamp(40px,8.5vw,68px)
    minmax(0,1fr)
    auto;

  align-items:center;

  gap:clamp(7px,1.6vw,14px);

  padding:
    0
    clamp(16px,3.5vw,30px)
    0
    clamp(14px,3vw,25px);

  min-width:0;

  color:var(--text);

  transition:
    transform .22s ease,
    filter .22s ease;
}

.member:hover{
  transform:scale(1.025);
  filter:
    drop-shadow(0 0 7px rgba(83,223,255,.65))
    brightness(1.12);
}

/* =========================================================
   AVATAR
   ========================================================= */

.avatar-wrap{
  display:flex;
  align-items:center;
  justify-content:center;

  width:clamp(36px,7.2vw,58px);
  height:clamp(36px,7.2vw,58px);

  border-radius:50%;

  border:
    clamp(1px,.3vw,2px)
    solid
    rgba(114,228,255,.95);

  background:rgba(1,10,22,.82);

  box-shadow:
    0 0 5px rgba(67,218,255,.9),
    0 0 14px rgba(0,174,255,.45);

  overflow:hidden;
}

.avatar{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
}

/* =========================================================
   MEMBER INFORMATION
   ========================================================= */

.member-info{
  min-width:0;
  overflow:hidden;
}

.username-line{
  display:flex;
  align-items:center;
  gap:5px;
  min-width:0;
}

.username{
  display:block;

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;

  color:#fff;

  font-size:clamp(10px,2.2vw,17px);
  font-weight:800;

  text-decoration:none;

  text-shadow:
    0 0 5px rgba(83,223,255,.65);
}

.username:hover{
  color:var(--cyan-bright);
}

.title{
  flex:none;

  padding:1px 4px;

  border-radius:3px;

  background:#d64242;
  color:#fff;

  font-size:clamp(6px,1.4vw,10px);
  font-weight:900;

  line-height:1.3;
}

.meta{
  display:flex;
  align-items:center;
  gap:6px;

  margin-top:2px;

  font-size:clamp(7px,1.5vw,11px);
  color:var(--muted);

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* =========================================================
   RATING
   ========================================================= */

.rating{
  min-width:clamp(38px,8vw,60px);

  text-align:right;

  color:var(--cyan-bright);

  font-size:clamp(10px,2.3vw,18px);
  font-weight:900;

  letter-spacing:.3px;

  text-shadow:
    0 0 5px rgba(83,223,255,.9),
    0 0 12px rgba(0,174,255,.5);
}

.rating-label{
  display:block;

  margin-top:1px;

  color:#7694a6;

  font-size:clamp(5px,1.15vw,8px);
  font-weight:700;

  letter-spacing:1px;
  text-transform:uppercase;
}

/* =========================================================
   LOADING
   ========================================================= */

.status{
  position:absolute;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  z-index:20;

  padding:9px 15px;

  border:1px solid rgba(83,223,255,.5);
  border-radius:8px;

  background:rgba(0,7,17,.9);

  color:#baf5ff;

  font-size:12px;
  font-weight:800;

  letter-spacing:1px;

  box-shadow:
    0 0 15px rgba(0,190,255,.3);

  white-space:nowrap;
}

.status.error{
  color:#ffd0d0;
  border-color:rgba(255,90,90,.5);
}

/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:420px){

  .member{
    grid-template-columns:
      34px
      minmax(0,1fr)
      42px;

    gap:6px;

    padding-left:12px;
    padding-right:14px;
  }

  .avatar-wrap{
    width:32px;
    height:32px;
  }

  .username{
    font-size:10px;
  }

  .meta{
    font-size:7px;
  }

  .rating{
    font-size:11px;
  }

  .rating-label{
    font-size:5px;
  }
}
</style>
</head>

<body>

<div class="member-board">

  <div
    id="status"
    class="status">
    SCANNING CLUB ROSTER...
  </div>

  <div
    id="memberList"
    class="member-list">
  </div>

</div>

<script>
/* =========================================================
   CONFIG
   ========================================================= */

const CLUB_SLUG = "the-mandalorians-club-1";
const MEMBER_LIMIT = 10;

/*
  Determines which rating is displayed.

  Instead of showing only Rapid, Blitz, etc.,
  this finds the member's highest current rating.
*/

function getHighestRating(stats){

  const ratings = [];

  const categories = [
    ["Rapid", stats?.chess_rapid?.last?.rating],
    ["Blitz", stats?.chess_blitz?.last?.rating],
    ["Bullet", stats?.chess_bullet?.last?.rating],
    ["Daily", stats?.chess_daily?.last?.rating],
    ["960", stats?.chess960_daily?.last?.rating]
  ];

  for(const [name,value] of categories){

    if(
      typeof value === "number" &&
      Number.isFinite(value)
    ){
      ratings.push({
        name,
        value
      });
    }
  }

  if(!ratings.length){
    return {
      value:"—",
      category:"UNRATED"
    };
  }

  ratings.sort(
    (a,b) => b.value - a.value
  );

  return {
    value:ratings[0].value,
    category:ratings[0].name
  };
}

/* =========================================================
   API
   ========================================================= */

async function fetchJSON(url){

  const response = await fetch(
    url,
    {
      headers:{
        "Accept":"application/json"
      }
    }
  );

  if(!response.ok){
    throw new Error(
      `HTTP ${response.status}`
    );
  }

  return response.json();
}

/*
  Chess.com's club member endpoint separates members
  into weekly, monthly and all-time groups.

  We merge them, remove duplicates, then sort them by
  join date so the newest members appear first.
*/

async function getNewestMembers(){

  const endpoint =
    `https://api.chess.com/pub/club/${CLUB_SLUG}/members`;

  const data = await fetchJSON(endpoint);

  const combined = [
    ...(data.weekly || []),
    ...(data.monthly || []),
    ...(data.all_time || [])
  ];

  const unique = new Map();

  for(const member of combined){

    if(!member?.username){
      continue;
    }

    const key =
      member.username.toLowerCase();

    if(!unique.has(key)){
      unique.set(key,member);
    }
  }

  return [...unique.values()]
    .sort(
      (a,b) =>
        (b.joined || 0) -
        (a.joined || 0)
    )
    .slice(0,MEMBER_LIMIT);
}

/* =========================================================
   PROFILE + STATS
   ========================================================= */

async function enrichMember(member){

  const username =
    member.username;

  const profileURL =
    `https://api.chess.com/pub/player/${encodeURIComponent(username)}`;

  const statsURL =
    `https://api.chess.com/pub/player/${encodeURIComponent(username)}/stats`;

  const [
    profileResult,
    statsResult
  ] = await Promise.allSettled([
    fetchJSON(profileURL),
    fetchJSON(statsURL)
  ]);

  const profile =
    profileResult.status === "fulfilled"
      ? profileResult.value
      : {};

  const stats =
    statsResult.status === "fulfilled"
      ? statsResult.value
      : {};

  const highest =
    getHighestRating(stats);

  return {
    username,
    avatar:
      profile.avatar ||
      "",
    title:
      profile.title ||
      "",
    joined:
      member.joined ||
      profile.joined ||
      0,
    rating:
      highest.value,
    category:
      highest.category
  };
}

/* =========================================================
   HTML
   ========================================================= */

function escapeHTML(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function memberHTML(member){

  const username =
    escapeHTML(member.username);

  const title =
    escapeHTML(member.title);

  const category =
    escapeHTML(member.category);

  const rating =
    escapeHTML(member.rating);

  const profileURL =
    `https://www.chess.com/member/${encodeURIComponent(member.username)}`;

  /*
    If Chess.com doesn't provide an avatar, use a
    simple SVG chess pawn instead of a broken image.
  */

  const fallbackAvatar =
    "data:image/svg+xml;charset=UTF-8," +
    encodeURIComponent(`
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="100"
        height="100"
        viewBox="0 0 100 100">

        <rect
          width="100"
          height="100"
          fill="#07111d"/>

        <circle
          cx="50"
          cy="30"
          r="13"
          fill="#63dcff"/>

        <path
          d="
            M39 43
            H61
            C61 55 66 63 72 70
            H28
            C34 63 39 55 39 43
            Z
          "
          fill="#63dcff"/>

        <rect
          x="23"
          y="70"
          width="54"
          height="10"
          rx="4"
          fill="#63dcff"/>

        <rect
          x="18"
          y="80"
          width="64"
          height="8"
          rx="4"
          fill="#63dcff"/>

      </svg>
    `);

  const avatar =
    member.avatar ||
    fallbackAvatar;

  return `
    <div class="member">

      <div class="avatar-wrap">

        <img
          class="avatar"
          src="${escapeHTML(avatar)}"
          alt="${username}"
          loading="lazy"
          onerror="
            this.onerror=null;
            this.src='${fallbackAvatar}';
          "
        >

      </div>

      <div class="member-info">

        <div class="username-line">

          ${
            title
              ? `<span class="title">${title}</span>`
              : ""
          }

          <a
            class="username"
            href="${profileURL}"
            target="_blank"
            rel="noopener noreferrer">
            ${username}
          </a>

        </div>

        <div class="meta">
          NEW MEMBER
        </div>

      </div>

      <div class="rating">

        ${rating}

        <span class="rating-label">
          ${category}
        </span>

      </div>

    </div>
  `;
}

/* =========================================================
   RENDER
   ========================================================= */

async function loadBoard(){

  const status =
    document.getElementById("status");

  const memberList =
    document.getElementById("memberList");

  try{

    const newest =
      await getNewestMembers();

    if(!newest.length){
      throw new Error(
        "No club members returned."
      );
    }

    const members =
      await Promise.all(
        newest.map(enrichMember)
      );

    memberList.innerHTML =
      members
        .map(memberHTML)
        .join("");

    status.style.display =
      "none";

  }
  catch(error){

    console.error(
      "Member board error:",
      error
    );

    status.textContent =
      "ROSTER UNAVAILABLE";

    status.classList.add(
      "error"
    );
  }
}

/* =========================================================
   START
   ========================================================= */

loadBoard();

/*
  Refresh every five minutes.

  This keeps the board reasonably current without
  hammering Chess.com's public API.
*/

setInterval(
  loadBoard,
  5 * 60 * 1000
);
</script>

</body>
</html>
